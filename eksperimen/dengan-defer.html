<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eksperimen: Dengan defer</title>
  <!-- Dengan defer: script berjalan setelah seluruh HTML selesai dibaca -->
  <script src="script.js" defer></script>
</head>
<body style="font-family: Arial, sans-serif; padding: 24px;">
  <h1 id="judul">Judul awal (belum diubah)</h1>
  <p>Halaman ini memuat script di &lt;head&gt; <strong>dengan</strong> atribut defer.</p>
</body>
</html>
