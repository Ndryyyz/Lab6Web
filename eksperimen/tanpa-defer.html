<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eksperimen: Tanpa defer</title>
  <!-- Tanpa defer: script berjalan saat HTML di bawahnya belum dibaca browser -->
  <script src="script.js"></script>
</head>
<body style="font-family: Arial, sans-serif; padding: 24px;">
  <h1 id="judul">Judul awal (belum diubah)</h1>
  <p>Halaman ini memuat script di &lt;head&gt; <strong>tanpa</strong> atribut defer.</p>
</body>
</html>
